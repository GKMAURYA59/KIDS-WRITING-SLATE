<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>My Writing Slate - Built By DivyaansH</title>
<style>
:root{--bg:#f4efe6;--ink:#2b2118;--mut:#6b5d50;--card:#fff;--line:#d9cfc0;--acc:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110e;--ink:#f3ece2;--mut:#b5a898;--card:#221d18;--line:#3a322a;--acc:#ff922b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 "Andika","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;display:flex;flex-direction:column;gap:6px;padding:6px;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.stage{position:relative;flex:1 1 auto;min-height:120px;width:100%;border:6px solid #b07a43;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.3);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#draw{touch-action:none;cursor:crosshair}
.tools{flex:none;display:flex;flex-direction:column;gap:5px;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center}
button{font:inherit;font-size:14px;font-weight:700;min-height:36px;min-width:36px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:2px 4px;cursor:pointer}
button:active{transform:scale(.94)}button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:#fff}
.sw{width:32px;height:32px;min-width:0;min-height:0;border:3px solid var(--line);border-radius:50%;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);background-clip:padding-box;transform:scale(1.18)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.dot{display:inline-block;border-radius:50%;background:currentColor;vertical-align:middle}
.lbl{display:none}
#clear.arm{background:#c62828;border-color:#c62828;color:#fff}#clear.arm .lbl{display:inline;margin-left:4px}
#let{font-size:26px;min-width:44px;text-align:center;font-weight:700}
#traceRow[hidden]{display:none}
details{color:var(--mut);font-size:13px}summary{cursor:pointer;padding:2px 8px}
select{font:inherit;min-height:36px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:2px 6px}
#fl{display:none}
/* full-screen writing mode: slate covers the whole screen, tools slide up on demand */
body.fs{padding:0;gap:0}
body.fs .stage{position:fixed;inset:0;border:0;border-radius:0;box-shadow:none;z-index:1}
body.fs .tools{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
body.fs .tools.open{transform:none}
body.fs #fl{display:flex;gap:8px;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:6}
#fl button{opacity:.93;font-size:18px}
@media (min-width:560px){.lbl{display:inline;margin-left:4px}button{min-height:46px;min-width:46px;padding:2px 10px;font-size:16px}.sw{width:42px;height:42px}.bar{gap:8px}body{padding:10px}}
</style></head><body>
<div class="stage" id="stage"><canvas id="guide"></canvas><canvas id="draw"></canvas></div>
<div id="fl"><button id="fe" aria-pressed="false" aria-label="Eraser" title="Eraser">🧽</button><button id="tg" aria-label="Show or hide tools" aria-expanded="false">🎨</button></div>
<div class="tools" id="tools">
<div class="bar" id="colors" role="group" aria-label="Pen colours"></div>
<div class="bar">
<button data-size="10" aria-label="Thin pen"><span class="dot" style="width:7px;height:7px"></span></button>
<button data-size="22" aria-label="Medium pen"><span class="dot" style="width:13px;height:13px"></span></button>
<button data-size="44" aria-label="Thick pen"><span class="dot" style="width:21px;height:21px"></span></button>
<button id="eraser" aria-pressed="false" aria-label="Eraser" title="Eraser">🧽<span class="lbl">Eraser</span></button>
<button id="undo" aria-label="Undo" title="Undo">↩️<span class="lbl">Undo</span></button>
<button id="clear" aria-label="Clear the slate" title="Clear">🗑️<span class="lbl">Clear</span></button>
<button id="save" aria-label="Save picture" title="Save">💾<span class="lbl">Save</span></button>
<button id="trace" aria-pressed="false" aria-label="Trace letters" title="Trace letters">✏️<span class="lbl">Trace</span></button>
<button id="fs" aria-pressed="false" aria-label="Full screen" title="Full screen">⛶<span class="lbl" id="fsl">Full screen</span></button>
</div>
<div class="bar" id="traceRow" hidden><button id="prev" aria-label="Previous letter">◀</button><span id="let" aria-live="polite">A</span><button id="next" aria-label="Next letter">▶</button></div>
<details><summary>Parent options</summary><div class="bar" style="margin-top:4px">
<label>Board <select id="board"><option value="chalk">Chalkboard</option><option value="white">Whiteboard</option></select></label>
<label>Paper <select id="paper"><option value="lines">Writing lines</option><option value="grid">Grid</option><option value="none">Plain</option></select></label>
<label>Letters <select id="set"><option value="ABCDEFGHIJKLMNOPQRSTUVWXYZ">ABC</option><option value="abcdefghijklmnopqrstuvwxyz">abc</option><option value="0123456789">123</option></select></label>
</div></details>
</div>
<script>
const $=s=>document.querySelector(s),LW=1200,FONT='"Andika","Comic Sans MS","Chalkboard SE",system-ui,sans-serif';
const st=$('#stage'),gc=$('#guide'),g=gc.getContext('2d'),dc=$('#draw'),d=dc.getContext('2d');
const BOARD={chalk:{bg:'#1f4d3a',line:'rgba(255,255,255,.28)',ink:'#ffffff',guide:'rgba(255,255,255,.45)',frame:'#b07a43'},white:{bg:'#fffdf7',line:'rgba(40,60,120,.28)',ink:'#222222',guide:'rgba(0,0,0,.35)',frame:'#9aa5b1'}};
const PEN=['ink','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#ec407a'];
let S={board:'chalk',paper:'lines',color:'ink',size:22,erase:false,trace:false,set:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',i:0,strokes:[]},cur=null,Lh=900,K=1;
const col=c=>c==='ink'?BOARD[S.board].ink:c;
$('#colors').innerHTML=PEN.map((c,i)=>`<button class="sw" data-c="${c}" aria-label="Colour ${i+1}" aria-pressed="false"></button>`).join('');
function paintSwatches(){document.querySelectorAll('.sw').forEach(b=>{b.style.background=col(b.dataset.c);b.setAttribute('aria-pressed',!S.erase&&S.color===b.dataset.c)})}
function paintSizes(){document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.size===S.size))}
// Everything is stored in "logical units": the slate is always 1200 units wide, so the drawing keeps its shape when the slate changes height.
function renderBoard(ctx,w,h,withGuide){const B=BOARD[S.board];ctx.setLineDash([]);ctx.fillStyle=B.bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle=B.line;ctx.lineWidth=3;ctx.lineCap='butt';
const ln=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
if(S.paper==='lines'){for(let y=130;y+150<h-10;y+=210){ln(40,y,w-40,y);ctx.setLineDash([14,14]);ln(40,y+75,w-40,y+75);ctx.setLineDash([]);ln(40,y+150,w-40,y+150)}}
else if(S.paper==='grid'){for(let x=0;x<=w;x+=60)ln(x,0,x,h);for(let y=0;y<=h;y+=60)ln(0,y,w,y)}
ctx.save();ctx.font=`700 54px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle=B.ink;ctx.globalAlpha=.9;ctx.fillText('Built By DivyaansH',w/2,82);ctx.restore();
if(withGuide&&S.trace){const em=Math.min(w*1.1,h*0.95);ctx.font=`700 ${em}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.strokeStyle=B.guide;ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([2,26]);ctx.strokeText(S.set[S.i],w/2,h/2+em*0.36);ctx.setLineDash([])}}
function paintBoard(){g.setTransform(K,0,0,K,0,0);renderBoard(g,LW,Lh,true);st.style.borderColor=BOARD[S.board].frame;document.querySelector('meta[name=theme-color]').content=BOARD[S.board].bg;document.body.dataset.board=S.board}
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function style(s){d.globalCompositeOperation=s.e?'destination-out':'source-over';d.strokeStyle=d.fillStyle=s.e?'#000':col(s.c);d.lineWidth=s.e?s.s*2:s.s;d.lineCap=d.lineJoin='round'}
function seg(s,i){const p=s.p;style(s);d.beginPath();
if(p.length===1){d.arc(p[0][0],p[0][1],d.lineWidth/2,0,7);d.fill();return}
if(i===1){const m=mid(p[0],p[1]);d.moveTo(p[0][0],p[0][1]);d.lineTo(m[0],m[1])}
else{const a=mid(p[i-2],p[i-1]),b=mid(p[i-1],p[i]);d.moveTo(a[0],a[1]);d.quadraticCurveTo(p[i-1][0],p[i-1][1],b[0],b[1])}d.stroke()}
function cap(s){const p=s.p,n=p.length;if(n<2)return;style(s);const m=mid(p[n-2],p[n-1]);d.beginPath();d.moveTo(m[0],m[1]);d.lineTo(p[n-1][0],p[n-1][1]);d.stroke()}
function redraw(){d.setTransform(1,0,0,1,0,0);d.globalCompositeOperation='source-over';d.clearRect(0,0,dc.width,dc.height);d.setTransform(K,0,0,K,0,0);
for(const s of S.strokes){if(s.p.length===1)seg(s,0);else{for(let i=1;i<s.p.length;i++)seg(s,i);cap(s)}}}
function fit(){const w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;const dpr=Math.min(window.devicePixelRatio||1,2);
for(const c of [gc,dc]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
Lh=h*LW/w;K=w*dpr/LW;paintBoard();redraw()}
new ResizeObserver(fit).observe(st);addEventListener('resize',fit);
// drawing
function pt(e){const r=dc.getBoundingClientRect(),k=LW/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]}
dc.addEventListener('pointerdown',e=>{if(!e.isPrimary||cur)return;e.preventDefault();dc.setPointerCapture(e.pointerId);disarm();$('#tools').classList.remove('open');$('#tg').setAttribute('aria-expanded',false);
cur={c:S.color,s:S.size,e:S.erase,p:[pt(e)]};S.strokes.push(cur);seg(cur,0)});
dc.addEventListener('pointermove',e=>{if(!cur||!e.isPrimary)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
for(const ev of (evs.length?evs:[e])){cur.p.push(pt(ev));if(cur.p.length>1)seg(cur,cur.p.length-1)}});
const end=()=>{if(!cur)return;if(cur.p.length>1)cap(cur);cur=null};
dc.addEventListener('pointerup',end);dc.addEventListener('pointercancel',end);
// tools
$('#colors').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;S.color=b.dataset.c;S.erase=false;eSync();paintSwatches()};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{S.size=+b.dataset.size;paintSizes()});
function eSync(){['#eraser','#fe'].forEach(q=>$(q).setAttribute('aria-pressed',S.erase))}
$('#eraser').onclick=()=>{S.erase=!S.erase;eSync();paintSwatches()};
$('#fe').onclick=()=>$('#eraser').click();
$('#undo').onclick=()=>{S.strokes.pop();redraw()};
let armT=null;const cl=$('#clear'),cll=cl.querySelector('.lbl');
function disarm(){clearTimeout(armT);cl.classList.remove('arm');cll.textContent='Clear'}
cl.onclick=()=>{if(cl.classList.contains('arm')){S.strokes=[];redraw();disarm()}else{cl.classList.add('arm');cll.textContent='Tap again';armT=setTimeout(disarm,3000)}};
$('#save').onclick=()=>{const t=document.createElement('canvas');t.width=LW;t.height=Math.round(Lh);const x=t.getContext('2d');renderBoard(x,LW,Lh,false);x.drawImage(dc,0,0,LW,Lh);
t.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-slate.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)})};
function paintLetter(){$('#let').textContent=S.set[S.i];paintBoard()}
$('#trace').onclick=()=>{S.trace=!S.trace;$('#trace').setAttribute('aria-pressed',S.trace);$('#traceRow').hidden=!S.trace;paintLetter()};
$('#prev').onclick=()=>{S.i=(S.i+S.set.length-1)%S.set.length;paintLetter()};
$('#next').onclick=()=>{S.i=(S.i+1)%S.set.length;paintLetter()};
$('#board').onchange=e=>{S.board=e.target.value;paintBoard();paintSwatches();redraw()};
$('#paper').onchange=e=>{S.paper=e.target.value;paintBoard()};
$('#set').onchange=e=>{S.set=e.target.value;S.i=0;paintLetter()};
// full screen: the slate fills the whole screen; the tools hide behind the 🎨 button
const FE=document.documentElement,reqFS=FE.requestFullscreen||FE.webkitRequestFullscreen,exitFS=document.exitFullscreen||document.webkitExitFullscreen;
const apiFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);let fsOn=false;
function setFS(on){fsOn=on;document.body.classList.toggle('fs',on);$('#tools').classList.remove('open');$('#tg').setAttribute('aria-expanded',false);$('#fs').setAttribute('aria-pressed',on);$('#fsl').textContent=on?'Exit':'Full screen';$('#fs').setAttribute('aria-label',on?'Exit full screen':'Full screen')}
$('#fs').onclick=()=>{if(!fsOn){setFS(true);if(reqFS){try{const r=reqFS.call(FE);if(r&&r.catch)r.catch(()=>{})}catch(e){}}}else{setFS(false);if(apiFS()&&exitFS)exitFS.call(document)}};
const fsSync=()=>{if(!apiFS()&&fsOn)setFS(false)};document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);
$('#tg').onclick=()=>{const o=$('#tools').classList.toggle('open');$('#tg').setAttribute('aria-expanded',o)};
paintSwatches();paintSizes();fit();
</script></body></html>
